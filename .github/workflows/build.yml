name: Build Ailments mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Create project files
        run: |
          mkdir -p src/main/java/com/ailments src/main/resources/META-INF
          echo '' | base64 -d > build.gradle
          echo '' | base64 -d > settings.gradle
          echo '' | base64 -d > gradle.properties
          echo '' | base64 -d > Ailments.java
          echo '' | base64 -d > neoforge.mods.toml

      - name: Build mod
        run: gradle build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ailments-jar
          path: build/libs/*.jar
          
