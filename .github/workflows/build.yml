name: Build mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache: disabled

      - name: Unzip sources
        run: python3 -c "import zipfile; zipfile.ZipFile('ailments-src.zip').extractall('build-src')"

      - name: Build
        run: |
          set -o pipefail
          if [ -f build-src/build.gradle ]; then
            cd build-src
          else
            cd "$(dirname "$(find build-src -name build.gradle | head -1)")"
          fi
          LOG="$GITHUB_WORKSPACE/build.log"
          (gradle build --no-daemon --stacktrace 2>&1 | tee "$LOG") || \
          (rm -rf ~/.cache/neoformruntime ~/.gradle/caches && \
           gradle build --no-daemon --stacktrace 2>&1 | tee -a "$LOG")

      - name: Diagnose
        if: failure()
        run: tail -n 150 "$GITHUB_WORKSPACE/build.log"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ailments-jar
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          
