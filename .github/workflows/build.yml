name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.10.2
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Unpack sources
        run: |
          python3 - <<'EOF'
          import zipfile, glob, os
          zipfile.ZipFile('ailments-src.zip').extractall('proj')
          d = os.path.dirname(next(iter(glob.glob('proj/**/build.gradle', recursive=True))))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"PROJ_DIR={d}\n")
          EOF

      - name: Build
        run: gradle -p $PROJ_DIR build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ailments-jar
          path: ${{ env.PROJ_DIR }}/build/libs/*.jar
          
