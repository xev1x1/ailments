name: Build mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip sources
        run: python3 -c "import zipfile; zipfile.ZipFile('ailments-src.zip').extractall('build-src')"

      - name: Build
        run: |
          if [ -f build-src/build.gradle ]; then
            cd build-src
          else
            cd "$(dirname "$(find build-src -name build.gradle | head -1)")"
          fi
          rm -rf ~/.cache/neoformruntime ~/.gradle/caches/neoformruntime
          sed -i "s/2\.0\.47/2.0.148/" build.gradle
          gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ailments-jar
          path: '**/build/libs/*.jar'
          
