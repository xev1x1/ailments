name: Build mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unzip sources
        run: |
          unzip -o ailments-src.zip -d build-src
          # если внутри архива вложенная папка — заходим в неё
          if [ -f build-src/build.gradle ]; then
            echo "PROJ_DIR=build-src" >> $GITHUB_ENV
          else
            SUBDIR=$(find build-src -name build.gradle | head -1 | xargs dirname)
            echo "PROJ_DIR=$SUBDIR" >> $GITHUB_ENV
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: chmod +x gradlew && ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ailments-jar
          path: ${{ env.PROJ_DIR }}/build/libs/*.jar
          
