name: Build mod

on: [push]

jobs:
  build:
    if: ${{ hashFiles('ailments-src.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip sources
        run: python3 -c "import zipfile; zipfile.ZipFile('ailments-src.zip').extractall('build-src')"

      - name: Detect project dir
        run: |
          if [ -f build-src/build.gradle ]; then
            echo "PROJ_DIR=build-src" >> "$GITHUB_ENV"
          else
            echo "PROJ_DIR=$(dirname "$(find build-src -name build.gradle | head -1)")" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ailments-jar
          path: ${{ env.PROJ_DIR }}/build/libs/*.jar
          
